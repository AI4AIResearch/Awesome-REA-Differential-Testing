name: Reproduce REA lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - run: node --test labs/electron-notes/app/csv.test.cjs
      - name: Analyze the original fixture
        run: |
          mkdir -p labs/electron-notes/output
          npx -y rea-agents@6.5.0 analyze-javascript-application "$PWD/labs/electron-notes/app" --json > labs/electron-notes/output/rea-evidence.json
      - run: python3 scripts/verify_evidence.py labs/electron-notes/output/rea-evidence.json
