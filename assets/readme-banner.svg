    <text x="52" y="150" font-size="80" font-weight="500" letter-spacing="-4" fill="#183440">Awesome REA<tspan fill="#8da971">.</tspan></text>
    <text x="55" y="204" font-size="27" letter-spacing="-.5" fill="#566b75">Understand software. Build from evidence.</text>
