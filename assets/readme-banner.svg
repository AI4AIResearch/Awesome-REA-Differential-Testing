  </defs>
  <rect width="1280" height="360" rx="18" fill="#f6f5ee"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <path d="M0 335H1280" stroke="#d6ddcc" stroke-opacity=".75"/>
