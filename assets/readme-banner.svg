<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Awesome REA — understand software, build from evidence</title>
  <desc id="description">An independent field guide for Website, Game, App, Binary and Firmware investigations. A diagram connects an artifact, a trace and its evidence.</desc>
